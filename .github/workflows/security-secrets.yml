name: Security - secrets
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 9 * * 1'
permissions:
  contents: read
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --max-time 60 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan full fetched history (redacted)
        run: '"$RUNNER_TEMP/gitleaks" git . --redact=100 --no-banner --ignore-gitleaks-allow --log-opts="--all" --timeout=600'
      - name: Scan current files and nested archives (redacted)
        if: ${{ !cancelled() }}
        run: '"$RUNNER_TEMP/gitleaks" dir . --redact=100 --no-banner --ignore-gitleaks-allow --max-archive-depth=2 --timeout=300'
